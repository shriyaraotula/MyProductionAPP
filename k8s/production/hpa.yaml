apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myproductionapp-hpa
  namespace: myproductionapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myproductionapp
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
