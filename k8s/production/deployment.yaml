2xb. nhapiVersion: apps/v1
kind: Deployment
metadata:
  name: myproductionapp
  namespace: myproductionapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myproductionapp
  template:
    metadata:
      labels:
        app: myproductionapp
    spec:
      containers:
        - name: web
          image: "${IMAGE_URI:-<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/myproductionapp:${GIT_SHA:-latest}}"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: myproductionapp-config
            - secretRef:
                name: myproductionapp-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
