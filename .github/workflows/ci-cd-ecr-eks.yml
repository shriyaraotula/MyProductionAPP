name: CI CD ECR -> EKS

on:
  push:
    branches:
      - feature/eks-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: myproductionapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_ENV

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: aws-actions/eks-kubectl@v2
        with:
          cluster-name: ${{ secrets.EKS_CLUSTER_NAME }}
          role-to-assume: ${{ secrets.EKS_DEPLOY_ROLE_ARN }}

      - name: Set image and apply manifests
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          # apply namespace, secrets, configmap
          kubectl apply -f k8s/production/namespace.yaml
          kubectl -n myproductionapp apply -f k8s/production/secret.yaml
          kubectl -n myproductionapp apply -f k8s/production/configmap.yaml
          # run migration job
          kubectl -n myproductionapp apply -f k8s/production/migrate-job.yaml
          kubectl -n myproductionapp wait --for=condition=complete job/myproductionapp-migrate --timeout=300s || true
          # update deployment image and apply
          kubectl -n myproductionapp set image deployment/myproductionapp web=${{ env.IMAGE_URI }}
          kubectl -n myproductionapp apply -f k8s/production/deployment.yaml
          kubectl -n myproductionapp apply -f k8s/production/service.yaml
          kubectl -n myproductionapp apply -f k8s/production/hpa.yaml
          kubectl -n myproductionapp apply -f k8s/production/ingress.yaml
